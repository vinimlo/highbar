[project]
name = "highbar"
version = "0.1.0rc3"
description = "Evals for AI agents that behave like tests."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "highbar contributors" }]
keywords = ["ai", "agents", "evals", "llm", "testing", "tool-calls", "guardrails", "ci"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pyyaml>=6.0",
    "rich>=13.0",
    "typer>=0.12",
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://vinimlo.github.io/highbar/"
Documentation = "https://vinimlo.github.io/highbar/"
Repository = "https://github.com/vinimlo/highbar"
Issues = "https://github.com/vinimlo/highbar/issues"
Changelog = "https://github.com/vinimlo/highbar/blob/main/CHANGELOG.md"

[project.optional-dependencies]
sdk = []
quickstart = ["fastapi>=0.115", "uvicorn>=0.30"]

[project.scripts]
highbar = "highbar.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/highbar"]

# `highbar init` writes the quickstart from here (src/highbar/cli/scaffold.py).
[tool.hatch.build.targets.wheel.force-include]
"examples/quickstart" = "highbar/_quickstart"

[tool.ruff]
target-version = "py312"
src = ["src"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "fastapi>=0.135.1",
    "pyright>=1.1.408",
    "pytest>=9.0.2",
    "pytest-timeout>=2.4.0",
    "ruff>=0.15.5",
    "uvicorn>=0.41.0",
]
