agent:
  start: "python -m my_agent.server"
  endpoint: "https://your-agent.example.com/chat"
  health: "https://your-agent.example.com/health"

suites:
  - name: Booking
    tests:
      - trigger: "I need to book a flight to Tokyo next Friday"
        variations: 5
        expect:
          function_calls:
            - name: search_flights
              params:
                destination: Tokyo
