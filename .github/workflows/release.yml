name: Release

# A tag v<version> builds the package, runs the quickstart with the built wheel,
# and publishes to PyPI by trusted publishing (no token). The PyPI project trusts
# this repository, this workflow (release.yml) and the environment "pypi".
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7

      # 0.13.4 and later no longer trust the emSign intermediates whose keys leaked.
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.13.5"

      - name: The tag is the package version
        run: uv run --no-project python scripts/check_release_tag.py "$GITHUB_REF_NAME"

      - name: Build
        run: uv build

      - name: Check the distributions
        run: uvx twine check dist/*

      - name: Run the quickstart with the built wheel
        run: scripts/smoke_wheel.sh dist/*.whl

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.13.5"

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish
        run: uv publish --trusted-publishing always dist/*
