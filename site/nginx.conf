server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # Redirects keep the host's port (4001), not the container's.
    absolute_redirect off;

    location = / {
        return 302 /highbar/;
    }

    location /highbar/ {
        try_files $uri $uri/ $uri.html /highbar/404.html;
    }
}
